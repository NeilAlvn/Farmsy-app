# Modest heap — this Mac has 8GB RAM.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# AGP 8.7.3 is tested up to compileSdk 35; we intentionally compile against 36
# to meet Play's target-API-36 requirement (deadline 2026-08-31). Silences the
# informational warning; the build is valid. Bump AGP when convenient to remove this.
android.suppressUnsupportedCompileSdk=36
