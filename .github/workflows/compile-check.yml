name: Compile check

# Compiles both apps on every pull request (and on demand).
# No signing, no secrets, no archive: keys stay empty and every feature that
# needs one is a no-op without it, so this proves "it builds", not behaviour.
# It exists so a change can be checked without anyone installing Xcode or
# Android Studio. The TestFlight archive stays in testflight.yml.
on:
  pull_request:
  workflow_dispatch:

# Cancel a run the moment a newer commit supersedes it. The iOS job below runs on
# a macOS runner, billed at ten times the Linux rate, so re-running it for a commit
# that was immediately followed by another is pure waste — an active pull request
# with several quick pushes spun up one macOS runner PER commit, which is what
# emptied the month's macOS allowance (34 macOS runs in eleven days, most of them
# superseded seconds later). Group per pull request (fall back to the ref for a
# manual run) and keep only the newest in flight: the latest commit is still fully
# checked, the superseded ones are dropped before they cost a runner.
concurrency:
  group: compile-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Which halves of the repo this pull request actually touches.
  #
  # The iOS job runs on a macOS runner, which bills at ten times the Linux rate.
  # A third of one afternoon's pull requests touched only Android or only docs
  # and still spun one up, which is what emptied the month's allowance in a few
  # hours. So the expensive job asks first.
  #
  # Deliberately generous: anything shared — the workflow itself, the parity
  # script, the repo docs — counts as touching iOS, and anything unexpected
  # (a manual run, a missing base) runs it too. A build that runs when it did
  # not need to costs fifty cents. One that is skipped when it was needed costs
  # a broken main nobody sees.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          if [ -z "$BASE" ] || [ -z "$HEAD" ]; then
            echo "not a pull request — running everything"
            echo "ios=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE" "$HEAD" || true)
          if [ -z "$CHANGED" ]; then
            echo "could not read the diff — running everything"
            echo "ios=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qE '^(Farmsy/|FarmsyTests/|FarmsyUITests/|Farmsy.xcodeproj/|.github/|scripts/|docs/)'; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
          else
            echo "ios=false" >> "$GITHUB_OUTPUT"
          fi
  ios:
    name: iOS (Xcode 26, simulator, unsigned)
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then
            echo "No Xcode 26 found on runner. Available Xcodes:"; ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      # -quiet keeps only warnings and errors in the log, so a failure is
      # readable without scrolling through thousands of lines of Xcode noise.
      - name: Build (Debug, iOS Simulator)
        run: |
          xcodebuild build -quiet \
            -project Farmsy.xcodeproj \
            -scheme Farmsy \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      # The unit tests (FarmsyTests) are hosted in the app, so they need a booted
      # simulator. Pick whichever iPhone the runner's Xcode ships rather than
      # hardcoding a model that the next Xcode renames.
      # -only-testing:FarmsyTests, because the scheme also carries
      # FarmsyUITests — the ScreenshotTour that drives the app to produce App
      # Store screenshots. That tour needs a real environment and fails on a
      # bare runner, which would leave every pull request red for a reason
      # with nothing to do with the change under review. The unit tests are
      # the gate. The tour is a tool you run on purpose.
      - name: Test (FarmsyTests on a simulator)
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import sys, json
          d = json.load(sys.stdin)['devices']
          print(next(x['udid'] for k in sorted(d, reverse=True) if 'iOS' in k
                     for x in d[k] if x['name'].startswith('iPhone')))")
          xcodebuild test -quiet \
            -project Farmsy.xcodeproj \
            -scheme Farmsy \
            -configuration Debug \
            -destination "id=$UDID" \
            -only-testing:FarmsyTests \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

  android:
    name: Android (assembleDebug)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Installs the compileSdk (36) and accepts its licence; the runner's
      # preinstalled SDK does not always carry the newest platform.
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0 platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      # gradle.properties pins org.gradle.java.home to a Homebrew JDK path that
      # only exists on a developer Mac. On the runner that path is invalid and
      # Gradle refuses to start, so drop the line and let setup-java's JDK apply.
      - name: Build (Debug)
        working-directory: android
        run: |
          sed -i '/^org\.gradle\.java\.home=/d' gradle.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

  # One check for the P0-1 rule that the iOS and Android analytics constants
  # never drift: same events, keys and values in the same order.
  analytics-parity:
    name: Analytics constants parity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/analytics-parity.sh
