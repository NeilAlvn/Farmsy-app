name: Build Archive (Xcode 26)

# Compiles Farmsy with Xcode 26 on a cloud Mac and hands back an UNSIGNED
# archive as a downloadable artifact. No signing key ever touches CI — the
# archive is signed and uploaded to TestFlight locally, where the key stays.
on:
  workflow_dispatch:

jobs:
  archive:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then
            echo "No Xcode 26 found on runner. Available Xcodes:"; ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      # Secrets.plist is gitignored (never committed), so a fresh CI checkout lacks
      # it — which left the RevenueCat/Sentry/PostHog client keys EMPTY in every
      # TestFlight build, so the membership sheet showed "can't be loaded" (the app
      # skips Purchases.configure when the key is empty). Decode it here from an
      # encrypted Actions secret. These are PUBLIC client keys (RevenueCat public SDK
      # key, Sentry DSN, PostHog key) that ship in the binary anyway — NOT Luuk's .p8
      # or any server secret, which never touch CI. Fail loudly if the secret is unset
      # rather than silently shipping another keyless build.
      - name: Inject Secrets.plist
        env:
          SECRETS_PLIST_BASE64: ${{ secrets.SECRETS_PLIST_BASE64 }}
        run: |
          if [ -z "$SECRETS_PLIST_BASE64" ]; then
            echo "::error::SECRETS_PLIST_BASE64 is not set — RevenueCat/analytics would be disabled. Set it with: base64 < Farmsy/Secrets.plist | tr -d '\n' | gh secret set SECRETS_PLIST_BASE64 --repo NeilAlvn/Farmsy-app"
            exit 1
          fi
          printf '%s' "$SECRETS_PLIST_BASE64" | base64 --decode > Farmsy/Secrets.plist
          # Sanity-check it parses and has the RevenueCat key, without printing values.
          plutil -lint Farmsy/Secrets.plist
          /usr/libexec/PlistBuddy -c "Print :RevenueCatPublicKey" Farmsy/Secrets.plist >/dev/null \
            && echo "Secrets.plist injected (RevenueCatPublicKey present)" \
            || { echo "::error::RevenueCatPublicKey missing from injected plist"; exit 1; }

      - name: Archive (unsigned)
        run: |
          xcodebuild archive \
            -project Farmsy.xcodeproj \
            -scheme Farmsy \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Farmsy.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Zip archive
        run: |
          cd "$RUNNER_TEMP" && zip -qry Farmsy.xcarchive.zip Farmsy.xcarchive
          ls -la Farmsy.xcarchive.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Farmsy-xcarchive
          path: ${{ runner.temp }}/Farmsy.xcarchive.zip
          retention-days: 5

      # Every in-app frame on every iOS event in Sentry currently reads "<redacted>".
      # The app has been reporting hangs for weeks (one group: 142 events, 35 users,
      # since 2 Sep) and not one of them can be resolved to a function, because the
      # debug symbols have never been uploaded — there is no sentry-cli anywhere in
      # this repo. Sentry matches dSYMs to events by UUID, so uploading them here
      # makes future events readable, and re-symbolicates the ones already stored.
      #
      # SENTRY_AUTH_TOKEN is the ORGANIZATION token (sntrys_). Its fixed org:ci scope
      # is exactly "upload debug files" — it cannot read issues or change settings,
      # which is why this is the right credential to hand CI. The read-scoped token
      # used for querying issues is a different thing and must NOT be put here.
      #
      # SENTRY_URL is not optional: this org lives on the EU region, and sentry-cli
      # defaults to sentry.io, where the request fails with an auth-looking error
      # that reads as "bad token" rather than "wrong host".
      #
      # This runs last and never fails the build. A missing dSYM costs readable
      # stacks; a hard failure would throw away a 40-minute archive over a Sentry
      # hiccup. It warns loudly instead.
      - name: Upload dSYMs to Sentry
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_URL: https://de.sentry.io
          SENTRY_ORG: farmsy
          SENTRY_PROJECT: farmy-ios
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "::warning::SENTRY_AUTH_TOKEN is not set — iOS stacks stay unsymbolicated (<redacted> frames). Set it with: gh secret set SENTRY_AUTH_TOKEN --repo NeilAlvn/Farmsy-app"
            exit 0
          fi
          DSYMS="$RUNNER_TEMP/Farmsy.xcarchive/dSYMs"
          if [ ! -d "$DSYMS" ] || [ -z "$(ls -A "$DSYMS" 2>/dev/null)" ]; then
            echo "::warning::No dSYMs found at $DSYMS — nothing to upload."
            exit 0
          fi
          npm install -g @sentry/cli@^2
          sentry-cli --version
          sentry-cli debug-files upload "$DSYMS"
          echo "dSYMs uploaded — future iOS events will symbolicate."
